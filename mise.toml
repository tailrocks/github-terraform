[tools]
opentofu = "1.13.1"

[settings]
lockfile = true

[tasks."tofu:plan"]
description = "Run tofu plan"
run = """
set -eu
export OP_ACCOUNT='zhokhov.1password.com'
GITHUB_TOKEN="$(op read 'op://tailrocks/GitHub/tailrocks-opentofu')" || { echo "op read failed, refusing to run" >&2; exit 1; }
export GITHUB_TOKEN
[ -n "${GITHUB_TOKEN:-}" ] || { echo "GITHUB_TOKEN is empty, refusing to run" >&2; exit 1; }
exec tofu plan "$@"
"""

[tasks."tofu:apply"]
description = "Run tofu apply"
run = """
set -eu
export OP_ACCOUNT='zhokhov.1password.com'
GITHUB_TOKEN="$(op read 'op://tailrocks/GitHub/tailrocks-opentofu')" || { echo "op read failed, refusing to run" >&2; exit 1; }
export GITHUB_TOKEN
[ -n "${GITHUB_TOKEN:-}" ] || { echo "GITHUB_TOKEN is empty, refusing to run" >&2; exit 1; }
exec tofu apply "$@"
"""
